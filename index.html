<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIC S.A. · Mantenimientos preventivos</title>
<style>
:root{--bg:#030a18;--card:#0d2038;--tx:#f2f6fb;--mu:#9fb0c5;--ln:#1c3556;--pr:#0a84d6;--pr2:#0690b7;--hd:#0a2744;--gr:#9fb0c5;--ok:#47c98a;--wa:#f0a93a;--er:#f26a74;--okb:#10301f;--wab:#3a2a0b;--erb:#3d1a1e;--gb:#252e3b;--cg:linear-gradient(160deg,#0f2b4d,#0a1a33);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:linear-gradient(#030a18,#051226);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{background:linear-gradient(90deg,#0a2744,#0b3358);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{height:46px;width:auto;max-width:48%;background:#eceef2;border-radius:10px;padding:5px 8px;display:block}
.hbtn{border:0;background:var(--pr);color:#fff;padding:12px 16px;border-radius:12px;font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#041022;border-bottom:1px solid var(--ln)}
nav button{flex:0 0 auto;border:0;background:none;color:#e4ecf6;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.hero{position:relative;overflow:hidden;background:var(--cg);border:1px solid var(--ln);border-radius:24px;padding:24px 22px;margin-bottom:16px}
.hero .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;opacity:.07;pointer-events:none}
.hero>*:not(.wm){position:relative}
.badge{display:flex;gap:10px;align-items:center;background:rgba(10,132,214,.18);border:1px solid #1f6aa5;color:#5ec2ff;border-radius:99px;padding:10px 16px;font-weight:600;font-size:14px;line-height:1.3;margin-bottom:20px}
.badge svg{flex:0 0 auto}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 14px;letter-spacing:-.3px}
.hero p{color:#c3cfdd;font-size:16px;line-height:1.65;margin:0 0 22px}
.hb{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--cg);border:1px solid var(--ln);border-top:3px solid var(--pr2);border-radius:16px;padding:12px;cursor:pointer}
.st b{font-size:26px;display:block}.st span{color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input,textarea{font:inherit;color:var(--tx);background:#0a1a33;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;max-width:100%}
.bar select{flex:1;min-width:140px}
.btn{border:0;background:var(--pr);color:#fff;padding:10px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.lg{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:14px;font-size:16px;font-weight:700}
.btn.s{background:var(--gb);border:1px solid #3a4556;color:var(--tx)}.btn.d{background:var(--erb);color:var(--er)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.row{background:var(--cg);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:start}
.row .i{min-width:0}.tag{white-space:nowrap}.row .i b{display:block}.row .i small{color:var(--mu)}
.acts{grid-column:1/-1;display:flex;gap:8px;border-top:1px solid var(--ln);padding-top:10px}.acts .btn{flex:1;text-align:center}.bar>.btn{flex:1}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.t-v{background:var(--erb);color:var(--er)}.t-p{background:var(--wab);color:var(--wa)}.t-o{background:var(--okb);color:var(--ok)}.t-n{background:var(--gb);color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#0d2038;border:1px solid var(--ln);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 10px}.sheet label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}.sheet input,.sheet select,.sheet textarea{width:100%}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:#0a1a33;padding:8px 14px;border-radius:99px;z-index:30;display:none;font-size:13px}
#note{background:var(--wab);color:var(--wa);padding:8px 14px;font-size:13px;display:none}
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(#030a18,#0a2744);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lf{width:100%;max-width:360px;background:var(--cg);border:1px solid var(--ln);border-radius:24px;padding:26px 22px;text-align:center}
#lf img{height:54px;max-width:100%;background:#eceef2;border-radius:10px;padding:6px 10px;margin-bottom:16px}
#lf h2{margin:0 0 6px}#lf p{color:var(--mu);margin:0 0 18px;font-size:14px}
#lf #pin{width:100%;text-align:center;font-size:24px;letter-spacing:.35em;margin-bottom:10px}
#le{color:var(--er);min-height:20px;font-size:14px;margin-bottom:8px}
</style></head><body>

const S={hospitales:{},tecnicos:{},equipos:{},mantenimientos:{}};
let view='panel',fH='',fT='',fE='',fA='',fO='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>s?pd(s).toLocaleDateString('es-AR'):'—';
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2600)}
function ask(t,ok,lb){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><h3>'+esc(t)+'</h3><div class="ft"><button class="btn s" id="n">Volver</button><button class="btn d" id="y">'+(lb||'Borrar')+'</button></div></div>';document.body.appendChild(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();ok()}}
function backup(){const data=JSON.stringify({app:'sic-mant',fecha:iso(today()),datos:S},null,1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='respaldo-sic-'+iso(today())+'.json';document.body.appendChild(a);a.click();a.remove();toast('Respaldo descargado')}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const x=JSON.parse(await f.text());const D=x.datos||x;let n=0;for(const c of COLS){const en=Object.entries(D[c]||{});if(!en.length)continue;for(const[id,v]of en)S[c][id]=v;n+=en.length;await sbReq('POST',c,en.map(([id,v])=>({id,data:v})),'',{Prefer:'resolution=merge-duplicates,return=minimal'})}render();toast('Cargados '+n+' registros')}catch(e){toast('No se pudo cargar el respaldo');loadAll()}};i.click()}
function chkTxt(m){if(!m.total)return '';const e=S.equipos[m.equipo];const it=CHK[e?e.tipo:'']||[];const ok=m.hechas||[];const pe=it.filter(x=>!ok.includes(x));return '<br>Checklist: '+ok.length+'/'+m.total+(pe.length?' · Pendiente: '+esc(pe.join(', ')):'')}
function opTag(e){const o=e.op||'Operativo';const k={'Operativo':'o','Operativo con observaciones':'p','En reparación':'p','Fuera de servicio':'v','Dado de baja':'n'}[o]||'n';return '<span class="tag t-'+k+'" style="margin:4px 0 2px;display:inline-block">'+esc(o)+'</span><br>'}
function heroHTML(){return '<div class="hero"><img class="wm" src="'+LOGO+'" alt=""><div class="badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span>SIC S.A. Ingeniería de Calidad — Control de Mantenimiento Preventivo Anual</span></div><h1>Gestión de Equipamiento Médico Crítico</h1><p>Sistema dedicado al seguimiento estricto de los mantenimientos preventivos anuales en autoanalizadores bioquímicos, respiradores, mesas de anestesia, compresores de aire y bombas de vacío instalados en instituciones hospitalarias.</p><div class="hb"><button class="btn s lg" data-v="agenda"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Ver Cronograma Anual</button></div></div>'}
function pickEq(){const L=list('equipos').filter(e=>e.op!=='Dado de baja');if(!L.length){toast('Primero cargá un equipo');return}
form('Registrar mantenimiento',[{k:'equipo',l:'Equipo',t:'select',r:1,o:L.sort((a,b)=>hN(a.hospital).localeCompare(hN(b.hospital))).map(e=>[e.id,hN(e.hospital)+' · '+e.tipo+(e.marca||e.modelo?' '+[e.marca,e.modelo].filter(Boolean).join(' '):'')+(e.serie?' · S/N '+e.serie:'')])}],{},o=>fMant(o.equipo))}
const SB_URL='https://snxhlboegsksevvjjfkl.supabase.co',SB_KEY='sb_publishable_9d_kQoVX1BV85eILTzb05w_Dn3ELJJp',SB_MAIL='Marianocolombo@hotmail.com.ar';
let ses=null,started=false;
function saveSes(j){ses={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000};try{localStorage.setItem('sic_ses',JSON.stringify(ses))}catch(e){}}
function endSes(){ses=null;try{localStorage.removeItem('sic_ses')}catch(e){}COLS.forEach(c=>S[c]={});render();showLock()}
async function authReq(body,gt){const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+gt,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||'auth'),{status:r.status});return j}
async function token(){if(!ses)throw new Error('sin sesión');if(Date.now()>ses.exp){try{saveSes(await authReq({refresh_token:ses.rt},'refresh_token'))}catch(e){endSes();throw new Error('sesión vencida')}}return ses.at}
async function sbReq(m,t,body,q,extra){const at=await token();const r=await fetch(SB_URL+'/rest/v1/'+t+(q||''),{method:m,headers:{apikey:SB_KEY,Authorization:'Bearer '+at,'Content-Type':'application/json',...(extra||{})},body:body?JSON.stringify(body):undefined});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status))}return m==='GET'?r.json():null}
async function loadAll(){try{const R=await Promise.all(COLS.map(c=>sbReq('GET',c,null,'?select=id,data&limit=10000')));COLS.forEach((c,i)=>{S[c]={};R[i].forEach(r=>S[c][r.id]=r.data)});$('#note').style.display='none';render()}catch(e){if(!ses)return;$('#note').textContent='Error de conexión con la base de datos: '+e.message;$('#note').style.display='block'}}
async function put(c,id,o){S[c][id]=o;render();try{await sbReq('POST',c,[{id,data:o}],'',{Prefer:'resolution=merge-duplicates,return=minimal'})}catch(e){toast('No se pudo guardar: '+e.message);loadAll()}}
async function del(c,id){delete S[c][id];render();try{await sbReq('DELETE',c,null,'?id=eq.'+encodeURIComponent(id))}catch(e){toast('No se pudo eliminar: '+e.message);loadAll()}}
function startApp(){render();loadAll();if(!started){started=true;setInterval(()=>{if(ses&&!document.hidden)loadAll()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses)loadAll()})}}
function showLock(){if($('#lock'))return;const d=document.createElement('div');d.id='lock';d.innerHTML='<form id="lf" autocomplete="on"><img src="'+LOGO+'" alt="SIC S.A."><h2>Ingresá tu PIN</h2><p>Acceso restringido al personal de SIC S.A.</p><input type="email" name="username" autocomplete="username" value="'+SB_MAIL+'" readonly tabindex="-1" style="position:absolute;opacity:0;height:0;width:0;padding:0;border:0"><input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required><div id="le"></div><button class="btn lg" style="width:100%;justify-content:center">Entrar</button></form>';document.body.appendChild(d);const f=d.querySelector('#lf');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;$('#le').textContent='';try{const j=await authReq({email:SB_MAIL,password:$('#pin').value},'password');saveSes(j);d.remove();startApp()}catch(x){$('#le').textContent=x.status===429?'Demasiados intentos. Esperá unos minutos.':x.status===400?'PIN incorrecto':'No se pudo conectar. Revisá tu conexión.'}b.disabled=false};setTimeout(()=>$('#pin').focus(),50)}
const list=c=>Object.entries(S[c]).map(([id,v])=>({id,...v}));
function ultimo(e){let u=e.inicial||'';for(const m of list('mantenimientos'))if(m.equipo===e.id&&m.fecha>u)u=m.fecha;return u}
function ultT(e,u){const m=list('mantenimientos').find(m=>m.equipo===e.id&&m.fecha===u);return m&&S.tecnicos[m.tecnico]?' · Técnico: '+esc(S.tecnicos[m.tecnico].nombre):''}
function estado(e){const u=ultimo(e);if(!u)return{k:'n',t:'Sin registro',due:null,d:-1e9};
const due=pd(u);due.setFullYear(due.getFullYear()+1);const d=Math.round((due-today())/864e5);
if(d<0)return{k:'v',t:'Vencido hace '+(-d)+' d',due,d};if(d<=60)return{k:'p',t:'Vence en '+d+' d',due,d};return{k:'o',t:'Al día · '+d+' d',due,d}}
const hN=id=>S.hospitales[id]?.nombre||'—',tN=id=>S.tecnicos[id]?.nombre||'—';
function form(title,fields,vals,ok){
const m=document.createElement('div');m.className='modal';
m.innerHTML='<form class="sheet"><h3>'+esc(title)+'</h3>'+fields.map(f=>{const v=vals[f.k]??f.def??'';let i;
if(f.t==='select')i='<select name="'+f.k+'"'+(f.r?' required':'')+'><option value="">Seleccionar…</option>'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
else if(f.t==='chk')i=f.o.map((x,n)=>'<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:14px;margin:6px 0"><input type="checkbox" name="chk" value="'+n+'" style="width:auto;margin-top:3px">'+esc(x)+'</label>').join('');else if(f.t==='textarea')i='<textarea rows="3" name="'+f.k+'">'+esc(v)+'</textarea>';
else i='<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.r?' required':'')+'>';
return '<label>'+f.l+(f.r?' *':'')+'</label>'+i}).join('')+'<div class="ft"><button type="button" class="btn s" id="x">Cancelar</button><button class="btn">Guardar</button></div></form>';
document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();
m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()});
m.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o={};fd.forEach((v,k)=>{if(k!=='chk')o[k]=v.trim()});if(fd.has('chk'))o.chk=fd.getAll('chk');ok(o);m.remove()}}
const opts=(c,k='nombre')=>list(c).sort((a,b)=>a[k].localeCompare(b[k])).map(x=>[x.id,x[k]]);
function fHosp(id){form(id?'Editar hospital':'Nuevo hospital',[{k:'nombre',l:'Nombre',r:1},{k:'ciudad',l:'Localidad'},{k:'contacto',l:'Contacto / teléfono'}],S.hospitales[id]||{},o=>put('hospitales',id||uid(),o))}
function fTec(id){form(id?'Editar técnico':'Nuevo técnico',[{k:'nombre',l:'Nombre y apellido',r:1},{k:'tel',l:'Teléfono'}],S.tecnicos[id]||{},o=>put('tecnicos',id||uid(),o))}
function fEq(id){if(!Object.keys(S.hospitales).length){toast('Primero agregá un hospital');return}
form(id?'Editar equipo':'Nuevo equipo',[{k:'hospital',l:'Hospital',t:'select',o:opts('hospitales'),r:1},{k:'tipo',l:'Tipo de equipo',t:'select',o:TIPOS.map(t=>[t,t]),r:1},{k:'marca',l:'Marca'},{k:'modelo',l:'Modelo'},{k:'serie',l:'N.º de serie / inventario'},{k:'inicial',l:'Fecha del último mantenimiento previo (si existe)',t:'date'},{k:'programado',l:'Fecha programada del próximo mantenimiento (opcional)',t:'date'},{k:'asig',l:'Técnico asignado',t:'select',o:opts('tecnicos')},{k:'op',l:'Estado del equipo',t:'select',o:OPS.map(x=>[x,x]),def:'Operativo'}],S.equipos[id]||{},o=>put('equipos',id||uid(),o))}
function fMant(eq){const e=S.equipos[eq];if(!Object.keys(S.tecnicos).length){toast('Primero agregá un técnico');return}
form('Registrar mantenimiento',[{k:'tecnico',l:'Técnico',t:'select',o:opts('tecnicos'),r:1},{k:'fecha',l:'Fecha de realización',t:'date',r:1,def:iso(today())},{k:'obs',l:'Observaciones / repuestos',t:'textarea'}],{tecnico:e.asig||''},o=>{put('mantenimientos',uid(),{...o,equipo:eq});if(e.programado)put('equipos',eq,{...e,programado:''});toast('Mantenimiento registrado')})}
function eqRow(e,full){const s=estado(e);const u=ultimo(e);
return '<div class="row"><div class="i"><b>'+esc(e.tipo)+' '+esc([e.marca,e.modelo].filter(Boolean).join(' '))+'</b>'+opTag(e)+'<small>'+esc(hN(e.hospital))+(e.serie?' · S/N '+esc(e.serie):'')+'<br>Último: '+fmt(u)+ultT(e,u)+' · Próximo: '+(s.due?fmt(iso(s.due)):'—')+'</small></div>'+
'<span class="tag t-'+s.k+'">'+s.t+'</span>'+(full?'<div class="acts"><button class="btn sm" data-a="mant" data-id="'+e.id+'">Registrar</button><button class="btn s sm" data-a="eeq" data-id="'+e.id+'">Editar</button><button class="btn d sm" data-a="deq" data-id="'+e.id+'">Borrar</button></div>':'')+'</div>'}
function filt(){return list('equipos').filter(e=>(!fH||e.hospital===fH)&&(!fT||e.tipo===fT)&&(fO?(e.op||'Operativo')===fO:(e.op||'Operativo')!=='Dado de baja')).map(e=>({...e,_s:estado(e)}))}
function bars(){return '<div class="bar"><select id="fh"><option value="">Todos los hospitales</option>'+opts('hospitales').map(o=>'<option value="'+o[0]+'"'+(o[0]===fH?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select><select id="ft"><option value="">Todos los equipos</option>'+TIPOS.map(t=>'<option'+(t===fT?' selected':'')+'>'+t+'</option>').join('')+'</select><select id="fo"><option value="">Todos los estados (sin bajas)</option>'+OPS.map(o=>'<option'+(o===fO?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'}
function render(){
const tabs=[['panel','Panel'],['agenda','Cronograma'],['equipos','Equipos'],['hospitales','Hospitales'],['tecnicos','Técnicos'],['hist','Mantenimientos'],['resp','Respaldo']];
$('#nav').innerHTML=tabs.map(t=>'<button data-v="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
let h='';
if(view==='panel'){const eq=filt();const c={v:0,p:0,o:0,n:0};eq.forEach(e=>c[e._s.k]++);
h=heroHTML()+bars()+'<div class="stats"><div class="st" data-e="">'+'<b>'+eq.length+'</b><span>Equipos</span></div><div class="st" data-e="v"><b style="color:var(--er)">'+c.v+'</b><span>Vencidos</span></div><div class="st" data-e="p"><b style="color:var(--wa)">'+c.p+'</b><span>Vencen en 60 días</span></div><div class="st" data-e="o"><b style="color:var(--ok)">'+c.o+'</b><span>Al día</span></div><div class="st" data-e="n"><b>'+c.n+'</b><span>Sin registro</span></div></div>';
const sh=eq.filter(e=>!fE||e._s.k===fE).sort((a,b)=>a._s.d-b._s.d);
h+=sh.length?sh.map(e=>eqRow(e)).join(''):'<div class="empty">No hay equipos para mostrar. Cargá hospitales y equipos para empezar.</div>'}
else if(view==='equipos'){const eq=filt().sort((a,b)=>hN(a.hospital).localeCompare(hN(b.hospital)));
h=bars()+'<div class="bar"><button class="btn" data-a="neq">+ Nuevo equipo</button></div>'+(eq.length?eq.map(e=>eqRow(e,1)).join(''):'<div class="empty">Sin equipos cargados.</div>')}
else if(view==='hist'){const ms=list('mantenimientos').sort((a,b)=>b.fecha.localeCompare(a.fecha));
h=ms.length?ms.map(m=>{const e=S.equipos[m.equipo];return '<div class="row"><div class="i"><b>'+esc(e?e.tipo+' '+[e.marca,e.modelo].filter(Boolean).join(' '):'Equipo eliminado')+'</b><small>'+esc(e?hN(e.hospital):'')+(e&&e.serie?' · S/N '+esc(e.serie):'')+'<br>Fecha: '+fmt(m.fecha)+' · Técnico: '+esc(tN(m.tecnico))+chkTxt(m)+(m.obs?'<br>'+esc(m.obs):'')+'</small></div><button class="btn d sm" data-a="dm" data-id="'+m.id+'">Borrar</button></div>'}).join(''):'<div class="empty">Todavía no hay mantenimientos registrados.</div>'}
else if(view==='agenda'){const L=filt().map(e=>({e,f:e.programado||(e._s.due?iso(e._s.due):'')})).filter(x=>(!fA||x.e.asig===fA)&&(x.e.programado||x.e._s.k!=='o')).sort((a,b)=>(a.f||'9').localeCompare(b.f||'9'));
const row=({e,f})=>'<div class="row"><div class="i"><b>'+esc(e.tipo)+' '+esc([e.marca,e.modelo].filter(Boolean).join(' '))+'</b><small>'+esc(hN(e.hospital))+(e.serie?' · S/N '+esc(e.serie):'')+'<br>'+(f?'Fecha: '+fmt(f)+(e.programado?' (programada)':' (vencimiento)'):'Sin fecha')+' · Técnico: '+esc(e.asig&&S.tecnicos[e.asig]?tN(e.asig):'sin asignar')+'</small></div><span class="tag t-'+e._s.k+'">'+e._s.t+'</span><div class="acts"><button class="btn sm" data-a="mant" data-id="'+e.id+'">Registrar</button><button class="btn s sm" data-a="eeq" data-id="'+e.id+'">Programar</button></div></div>';
const sec=(t,c,a)=>a.length?'<h3 style="margin:16px 2px 8px;color:'+c+'">'+t+' ('+a.length+')</h3>'+a.map(row).join(''):'';
const V=L.filter(x=>x.e._s.k==='v'),P=L.filter(x=>x.e._s.k!=='v'&&(x.f||x.e.programado)&&!(x.e._s.k==='n'&&!x.e.programado)),N=L.filter(x=>x.e._s.k==='n'&&!x.e.programado);
h='<div class="bar"><select id="fh"><option value="">Todos los hospitales</option>'+opts('hospitales').map(o=>'<option value="'+o[0]+'"'+(o[0]===fH?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select><select id="fa"><option value="">Todos los técnicos</option>'+opts('tecnicos').map(o=>'<option value="'+o[0]+'"'+(o[0]===fA?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></div><div style="color:var(--mu);font-size:13px;margin:0 2px 4px">Solo se muestra lo que requiere acción: equipos vencidos, por vencer en 60 días, programados o sin registro.</div>';
h+=L.length?sec('Vencidos','var(--er)',V)+sec('Próximos y programados','var(--wa)',P)+sec('Sin registro','var(--mu)',N):'<div class="empty">No hay mantenimientos pendientes. Todo al día.</div>'}
else if(view==='resp'){h='<div class="row"><div class="i"><b>Descargar respaldo</b><small>Guarda hospitales, técnicos, equipos e historial en un archivo.</small></div><div class="acts"><button class="btn" data-a="bk">Descargar respaldo</button></div></div><div class="row"><div class="i"><b>Cargar respaldo</b><small>Restaura los datos desde un archivo de respaldo. Se suman a los actuales; si un registro ya existe, se reemplaza.</small></div><div class="acts"><button class="btn s" data-a="rs">Elegir archivo</button></div></div><div class="row"><div class="i"><b>Bloquear la app</b><small>Cierra la sesión en este dispositivo. Para volver a entrar se pide el PIN.</small></div><div class="acts"><button class="btn d" data-a="lo">Cerrar sesión</button></div></div>'}
else if(view==='hospitales'){h='<div class="bar"><button class="btn" data-a="nh">+ Nuevo hospital</button></div>'+(opts('hospitales').map(([id])=>{const x=S.hospitales[id];const n=list('equipos').filter(e=>e.hospital===id).length;return '<div class="row"><div class="i"><b>'+esc(x.nombre)+'</b><small>'+esc([x.ciudad,x.contacto].filter(Boolean).join(' · '))+' · '+n+' equipos</small></div><div class="acts"><button class="btn s sm" data-a="eh" data-id="'+id+'">Editar</button><button class="btn d sm" data-a="dh" data-id="'+id+'">Borrar</button></div></div>'}).join('')||'<div class="empty">Sin hospitales.</div>')}
else{h='<div class="bar"><button class="btn" data-a="nt">+ Nuevo técnico</button></div>'+(opts('tecnicos').map(([id])=>{const x=S.tecnicos[id];const n=list('mantenimientos').filter(m=>m.tecnico===id).length;return '<div class="row"><div class="i"><b>'+esc(x.nombre)+'</b><small>'+esc(x.tel||'')+' · '+n+' mantenimientos realizados</small></div><div class="acts"><button class="btn s sm" data-a="et" data-id="'+id+'">Editar</button><button class="btn d sm" data-a="dt" data-id="'+id+'">Borrar</button></div></div>'}).join('')||'<div class="empty">Sin técnicos.</div>')}
$('#app').innerHTML=h}
document.addEventListener('click',e=>{
const v=e.target.closest('[data-v]');if(v){view=v.dataset.v;render();return}
const st=e.target.closest('[data-e]');if(st){fE=st.dataset.e;render();return}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='pk')pickEq();else if(a==='lo')endSes();else if(a==='bk')backup();else if(a==='rs')restore();else if(a==='mant')fMant(id);else if(a==='neq')fEq();else if(a==='eeq')fEq(id);else if(a==='nh')fHosp();else if(a==='eh')fHosp(id);else if(a==='nt')fTec();else if(a==='et')fTec(id);
else if(a==='deq'){ask('¿Borrar este equipo y su historial?',()=>{list('mantenimientos').filter(m=>m.equipo===id).forEach(m=>del('mantenimientos',m.id));del('equipos',id)})}
else if(a==='dm'){ask('¿Borrar este registro del historial?',()=>del('mantenimientos',id))}
else if(a==='dh'){if(list('equipos').some(x=>x.hospital===id))toast('Tiene equipos cargados');else ask('¿Borrar este hospital?',()=>del('hospitales',id))}
else if(a==='dt'){ask('¿Borrar este técnico? El historial conserva sus registros.',()=>del('tecnicos',id))}});
document.addEventListener('change',e=>{if(e.target.id==='fh'){fH=e.target.value;render()}if(e.target.id==='ft'){fT=e.target.value;render()}if(e.target.id==='fa'){fA=e.target.value;render()}if(e.target.id==='fo'){fO=e.target.value;render()}});
(async()=>{
try{const x=JSON.parse(localStorage.getItem('sic_ses')||'null');if(x){ses=x;await token()}}catch(e){ses=null}
if(ses)startApp();else showLock()})();
</script></body></html>
